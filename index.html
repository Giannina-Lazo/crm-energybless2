  --forest2: #475569;       /* Marrón medio */

  --mint: #cbd5e1;          /* Verde grisáceo */
  --foam: #e2e8f0;          /* Crema */
  --mist: #f8fafc;          /* Crema muy claro */
  --snow: #f8fafc;          /* Blanco hueso */
  --champagne: #d4a017;     /* Champagne dorado elegante */
  --gold: #eab308;          /* Dorado cálido */
  --gold-soft: #eff6ff;     /* Dorado pastel suave */
  --gold-mist: #fef9c3;     /* Dorado muy claro */
  --bg: #ffffff;            /* Fondo cálido */
  --card: #ffffff;          /* Tarjetas blancas cálidas */
  --border: #cbd5e1;        /* Bordes beige */
  --border2: #cbd5e1;       /* Bordes secundarios */
  --text: #1e293b;          /* Texto principal marrón oscuro */
  --text2: #334155;         /* Texto secundario */
  --muted: #475569;         /* Texto suave */
  --muted2: #64748b;        /* Texto más claro */
  --danger: #dc2626;        /* Rojo cálido */
  --danger-soft: #f5d5d5;   /* Rojo pastel */
  --warn: #b45309;          /* Amarillo quemado */
  --warn-soft: #fde68a;     /* Amarillo pastel */
  --info: #475569;          /* Azul grisáceo suave */
  --info-soft: #e2e8f0;     /* Azul pastel suave */
  --radius: 14px;
  --radius-sm: 9px;
  --shadow: 0 2px 12px rgba(30,41,59, 0.1);
  --shadow-md: 0 6px 24px rgba(30,41,59, 0.16);
  --shadow-lg: 0 14px 48px rgba(30,41,59, 0.22);
}

/* LOGIN */
.login-wrap{min-height:100vh;background:linear-gradient(145deg,var(--forest) 0%,var(--forest2) 40%,var(--sage) 80%,#1d4ed8 100%);display:flex;align-items:center;justify-content:center;padding:2rem}
.login-box{background:rgba(255,255,255,0.97);border-radius:24px;padding:2.8rem 2.4rem;width:100%;max-width:400px;box-shadow:0 32px 80px rgba(0,0,0,0.35)}
.login-logo{text-align:center;margin-bottom:1.8rem}
.login-logo .emblem{width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,var(--forest),var(--sage));display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;font-size:28px;box-shadow:0 8px 24px rgba(15,45,31,0.3)}
.login-logo .brand{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:700;color:var(--forest);letter-spacing:1px}
.login-logo .sub{font-size:11px;color:var(--champagne);letter-spacing:3px;text-transform:uppercase;margin-top:6px;font-weight:500}
.divider-gold{width:48px;height:2px;background:linear-gradient(90deg,transparent,var(--champagne),transparent);margin:12px auto}
/* FORMS */
.field{margin-bottom:1rem}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:.8px}
.field input,.field select,.field textarea,input.fi,select.fi,textarea.fi{width:100%;padding:11px 14px;border:1.5px solid var(--border2);border-radius:var(--radius-sm);font-family:'Outfit',sans-serif;font-size:14px;color:var(--text);background:var(--snow);transition:all .2s}
.field input:focus,.field select:focus,.field textarea:focus,input.fi:focus,select.fi:focus{outline:none;border-color:var(--sage);background:#fff;box-shadow:0 0 0 3px rgba(30,58,138,0.1)}
.field textarea{resize:vertical;min-height:80px}
input.search{padding:9px 14px;border:1.5px solid var(--border2);border-radius:var(--radius-sm);font-family:'Outfit',sans-serif;font-size:13px;background:var(--snow);color:var(--text)}
input.search:focus,select.search:focus{outline:none;border-color:var(--sage);background:#fff}
select.search{padding:9px 14px;border:1.5px solid var(--border2);border-radius:var(--radius-sm);font-family:'Outfit',sans-serif;font-size:13px;background:var(--snow);color:var(--text)}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 18px;border-radius:var(--radius-sm);font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;border:none;white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,var(--sage),var(--forest2));color:#fff;box-shadow:0 4px 14px rgba(30,58,138,0.3)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(30,58,138,0.4)}
.btn-gold{background:linear-gradient(135deg,var(--champagne),#ca8a04);color:#fff}
.btn-gold:hover{transform:translateY(-1px)}
.btn-outline{background:transparent;color:var(--sage);border:1.5px solid var(--border2)}
.btn-outline:hover{background:var(--mist);border-color:var(--sage)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#b91c1c}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-xs{padding:4px 9px;font-size:11px;border-radius:7px}
.btn-full{width:100%;justify-content:center;padding:13px}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none!important}
/* BADGES */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.badge-green{background:#dbeafe;color:#0f5e32}
.badge-gold{background:var(--gold-soft);color:#854d0e}
.badge-red{background:#fef2f2;color:var(--danger)}
.badge-blue{background:#dbeafe;color:#1a4d8a}
.badge-gray{background:#e2e8f0;color:#334155}
.badge-purple{background:#ede9fe;color:#6d28d9}
.badge-forest{background:var(--forest);color:#fff}
/* LAYOUT */
.app{display:flex;min-height:100vh}
.sidebar{width:240px;background:var(--forest);flex-shrink:0;display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;overflow-y:auto}
.sidebar-brand{padding:1.4rem;border-bottom:1px solid rgba(255,255,255,0.08)}
.logo-row{display:flex;align-items:center;gap:12px}
.logo-icon{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--sage),var(--mint));display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.sidebar-brand .brand{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:700;color:#fff}
.sidebar-brand .sub{font-size:9.5px;color:var(--gold);letter-spacing:2px;text-transform:uppercase;margin-top:2px}
.sidebar-user{padding:.9rem 1.4rem;border-bottom:1px solid rgba(255,255,255,0.08);background:rgba(0,0,0,0.18)}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--champagne),#ca8a04);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;margin-bottom:8px}
.sidebar-user .name{font-size:13px;font-weight:600;color:#fff}
.sidebar-user .role{font-size:10px;color:rgba(168,221,192,0.8);margin-top:1px}
.sidebar-nav{flex:1;padding:.6rem 0}
.nav-section{padding:10px 1.4rem 4px;font-size:9.5px;color:rgba(255,255,255,0.28);letter-spacing:2.5px;text-transform:uppercase;font-weight:600}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 1.4rem;color:rgba(255,255,255,0.58);cursor:pointer;transition:all .18s;font-size:13px;font-weight:500;border-left:3px solid transparent}
.nav-item:hover{background:rgba(255,255,255,0.07);color:#fff}
.nav-item.active{background:rgba(255,255,255,0.1);color:#fff;border-left-color:var(--gold)}
.nav-icon{font-size:15px;width:20px;text-align:center;flex-shrink:0}
.nav-badge{margin-left:auto;background:var(--gold);color:var(--forest);font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px}
.sidebar-footer{padding:1rem 1.4rem;border-top:1px solid rgba(255,255,255,0.08)}
.sidebar-status{font-size:10px;color:rgba(59,130,246,0.7);display:flex;align-items:center;gap:5px;margin-bottom:8px}
.sidebar-status::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--mint);flex-shrink:0}
.main{margin-left:240px;flex:1;display:flex;flex-direction:column;min-height:100vh}
.topbar{background:rgba(255,255,255,0.92);border-bottom:1px solid var(--border);padding:.85rem 1.8rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;backdrop-filter:blur(12px)}
.topbar-title{font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:700;color:var(--forest)}
.topbar-right{display:flex;align-items:center;gap:.7rem}
.page-content{padding:1.6rem;flex:1}

.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:.5rem}
.card-title{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:700;color:var(--forest)}
.card-subtitle{font-size:12px;color:var(--muted);margin-top:2px}
/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:1.4rem}
.stat-card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:1.1rem 1.3rem;position:relative;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:all .2s}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.stat-card::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--sage),var(--mint))}
.stat-card.gold::after{background:linear-gradient(90deg,var(--champagne),var(--gold))}
.stat-card.info::after{background:linear-gradient(90deg,var(--info),#3b82f6)}
.stat-card.warn::after{background:linear-gradient(90deg,var(--warn),#f59e0b)}
.stat-num{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:700;color:var(--forest);margin-top:5px;line-height:1}
.stat-card.gold .stat-num{color:var(--champagne)}
.stat-label{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;font-weight:600}
.stat-change{font-size:11px;color:var(--mint);margin-top:5px;font-weight:500}

table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--snow);color:var(--forest2);font-weight:700;padding:9px 12px;text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.9px;border-bottom:2px solid var(--border)}
td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--snow)}

.tag{display:inline-block;padding:3px 10px;border-radius:6px;font-size:11px;background:var(--mist);color:var(--forest2);border:1px solid var(--foam);font-weight:500}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:2rem 1rem;overflow-y:auto;backdrop-filter:blur(3px)}

.loading-screen .brand{font-family:'Cormorant Garamond',serif;font-size:28px;color:#fff;font-weight:700}
.loading-screen .sub{color:rgba(255,255,255,0.6)}

::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--foam);border-radius:4px}
@media(max-width:768px){
  .sidebar{width:100%;height:auto;position:relative}
  .main{margin-left:0}
  .stats-grid,.formularios-grid{grid-template-columns:repeat(2,1fr)}
  .grid2{grid-template-columns:1fr}
  .app{flex-direction:column}
}
</style>

async function sbGet(table, fallback) {
  try {
    const r = await fetch(`${SUPA_URL}/rest/v1/${table}?select=*`, {headers: SB_H});
    if (!r.ok) return fallback;
    const j = await r.json();
    if (!Array.isArray(j) || !j.length) return fallback;
    if (j[0] && j[0].data !== undefined) return j.map(x => x.data);
    return j;
  } catch(e) { return fallback; }
}

async function sbSet(table, arr) {
  try {
    await fetch(`${SUPA_URL}/rest/v1/${table}`, {
      method: 'POST',
      headers: {...SB_H, 'Prefer': 'resolution=merge-duplicates'},
      body: JSON.stringify(arr.map(x => ({id: x.id || 'r'+Math.random(), data: x})))
    });
  } catch(e) {}
}

function buildDonut(slices, size=110) {
  const total = slices.reduce((s,x) => s+x.val, 0);
  if (!total) return '<div style="text-align:center;color:#475569;padding:1rem;font-size:12px">Sin datos</div>';
  let angle = -90;
  const cx = size/2, cy = size/2, r = size*0.38, inner = size*0.22;
  function tr(d) { return d * Math.PI / 180; }
  let paths = '';
  slices.forEach(s => {
    const pct = s.val/total;
    const a1 = angle, a2 = angle + pct*360;
    angle = a2;
    const x1=cx+r*Math.cos(tr(a1)), y1=cy+r*Math.sin(tr(a1));
    const x2=cx+r*Math.cos(tr(a2)), y2=cy+r*Math.sin(tr(a2));
    const xi1=cx+inner*Math.cos(tr(a1)), yi1=cy+inner*Math.sin(tr(a1));
    const xi2=cx+inner*Math.cos(tr(a2)), yi2=cy+inner*Math.sin(tr(a2));
    const lg = pct > 0.5 ? 1 : 0;
    paths += `<path d="M${xi1},${yi1} L${x1},${y1} A${r},${r} 0 ${lg},1 ${x2},${y2} L${xi2},${yi2} A${inner},${inner} 0 ${lg},0 ${xi1},${yi1}Z" fill="${s.color}" opacity=".92"/>`;
  });
  const legend = slices.map(s => `<div style="display:flex;align-items:center;gap:7px;margin-bottom:5px;font-size:11.5px"><div style="width:10px;height:10px;border-radius:3px;background:${s.color};flex-shrink:0"></div><span style="flex:1">${escHtml(s.label)}</span><span style="font-weight:700;color:${s.color}">${s.val}</span></div>`).join('');
  return `<div style="display:flex;align-items:center;gap:1rem;flex-wrap:wrap">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex-shrink:0">${paths}
      <text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a" font-family="Cormorant Garamond,serif">${total}</text>
    </svg>
    <div style="flex:1;min-width:100px">${legend}</div>
  </div>`;
}

function buildBar(data, height=80) {
  if (!data || !data.length) return '';
  const max = Math.max(...data.map(d => d.val), 1);
  const w = Math.floor(340/data.length) - 5;
  let bars = '';
  data.forEach((d,i) => {
    const bH = Math.max(3, Math.round(d.val/max*height));
    const x = i*(w+5)+2;
    const y = height-bH;
    bars += `<rect x="${x}" y="${y}" width="${w}" height="${bH}" rx="4" fill="url(#bg)"/>
      <text x="${x+w/2}" y="${height+16}" text-anchor="middle" font-size="9.5" fill="#475569" font-family="Outfit,sans-serif">${escHtml(d.label)}</text>`;
    if(d.val > 0) bars += `<text x="${x+w/2}" y="${y-4}" text-anchor="middle" font-size="9.5" fill="#1e3a8a" font-family="Outfit,sans-serif" font-weight="700">${d.val}</text>`;
  });
  return `<svg width="100%" viewBox="0 0 340 ${height+28}" style="overflow:visible">
    <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1e3a8a"/><stop offset="100%" stop-color="#3b82f6" stop-opacity=".7"/></linearGradient></defs>
    ${bars}
  </svg>`;
}

function buildFunnel(leads) {
  const tot = leads.length;
  const nv = leads.filter(l=>l.status==='Nuevo').length;
  const ct = leads.filter(l=>l.status==='Contactado').length;
  const sg = leads.filter(l=>l.status==='Seguimiento').length;
  const va = leads.filter(l=>l.status==='Visita agendada').length;
  const pe = leads.filter(l=>l.status==='Propuesta enviada').length;
  const rv = leads.filter(l=>l.status==='Reservado').length;
  const fs = [
    {label:'Total',val:tot,color:'#0f172a'},
    {label:'Contactados',val:ct+sg+va+pe+rv,color:'#1e3a8a'},
    {label:'Seguimiento',val:sg+va+pe+rv,color:'#2563eb'},
    {label:'Visita/Prop.',val:va+pe+rv,color:'#d4a017'},
    {label:'Reservados',val:rv,color:'#eab308'}
  ];
  let html = '';
  fs.forEach((s,i) => {
    const pc = tot>0 ? Math.round(s.val/tot*100) : 0;
    const width = 100-i*11;
    html += `<div style="text-align:center;margin-bottom:5px">
      <div style="width:${width}%;margin:0 auto;background:${s.color};color:#fff;border-radius:7px;padding:9px 12px;font-size:12px;font-weight:600;display:flex;justify-content:space-between;padding-left:14px;padding-right:14px">
        <span>${escHtml(s.label)}</span>
        <span style="background:rgba(255,255,255,0.22);border-radius:12px;padding:1px 9px">${s.val} (${pc}%)</span>
      </div>
      ${i < fs.length-1 ? '<div style="font-size:12px;color:#475569">▼</div>' : ''}
    </div>`;
  });
  const cr = tot>0 ? Math.round(rv/tot*100) : 0;
  html += `<div style="margin-top:1rem;padding:10px 14px;background:#eff6ff;border-radius:9px;font-size:12px;display:flex;justify-content:space-between;border:1px solid #bfdbfe">
    <span class="fw7" style="color:#0f172a">Tasa de conversión</span>
    <span class="fw7" style="color:#1e3a8a;font-size:15px">${cr}%</span>
  </div>`;
  return html;
}

function getRankingAsesores(reservas, escrituras) {
  const rm = {};
  reservas.forEach(r => r.asesores.split(/y|,/).map(n=>n.trim()).filter(Boolean).forEach(n => {
    if(!rm[n]) rm[n] = {res:0,esc:0};
    rm[n].res++;
  }));
  escrituras.forEach(e => e.asesores.split(/y|,/).map(n=>n.trim()).filter(Boolean).forEach(n => {
    if(!rm[n]) rm[n] = {res:0,esc:0};
    rm[n].esc++;
  }));
  return Object.entries(rm).map(([name,v]) => ({name,res:v.res,esc:v.esc,score:v.res*2+v.esc*3}))
    .filter(x=>x.score>0).sort((a,b)=>b.score-a.score);
}

    const u = ADMINS.find(u => u.email.toLowerCase() === email.toLowerCase() && u.pass === pass);

      btn.textContent = 'Ingresar al sistema';

    const code = document.getElementById('l-code').value.trim();
    const pass = document.getElementById('l-pass2').value;
    const advList = await sbGet('eb_advisors', ADVS_INIT);

function goPage(p) { STATE.page = p; render(); }

// ===================== DASHBOARD =====================
function renderDash() {
  const {leads, tasks, advisors, reservas, escrituras} = STATE;
  const nv=leads.filter(l=>l.status==='Nuevo').length;
  const rv=leads.filter(l=>l.status==='Reservado').length;
  const ct=leads.filter(l=>l.status==='Contactado').length;
  const sg=leads.filter(l=>l.status==='Seguimiento').length;
  const ds=leads.filter(l=>l.status==='Descartado').length;
  const pt=tasks.filter(t=>t.status!=='Completada').length;
  const dt=tasks.filter(t=>t.status==='Completada').length;
  const cr=leads.length>0?Math.round(rv/leads.length*100):0;
  const bp={};leads.forEach(l=>{bp[l.project]=(bp[l.project]||0)+1});
  const pd=Object.entries(bp).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([l,v])=>({label:l.split(' ')[0],val:v}));
  const ra = getRankingAsesores(reservas, escrituras).slice(0,5);
  const ms = ra[0] ? ra[0].score : 1;
  const rl=leads.slice(-5).reverse();
  const rankHtml = ra.map((a,i)=>`
    <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #e2e8f0">
      <span style="font-size:16px;min-width:24px">${medalOf(i)}</span>
      <div style="flex:1">
        <div style="display:flex;justify-content:space-between;margin-bottom:3px"><span class="fw6" style="font-size:13px">${escHtml(a.name)}</span><span class="badge badge-green">${a.score}</span></div>
        <div class="prog-bar"><div class="prog-bar-fill" style="width:${Math.round(a.score/ms*100)}%"></div></div>
      </div>
    </div>`).join('');
  const recHtml = rl.map(l=>`
    <div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #e2e8f0">
      <div><div class="fw6" style="font-size:13px">${escHtml(l.name)}</div><div class="text-muted">${escHtml(l.project)} · ${l.date}</div></div>
      <span class="badge ${SCOL[l.status]||'badge-gray'}">${l.status}</span>
    </div>`).join('');

  return `
  <div class="stats-grid">
    <div class="stat-card" onclick="goPage('leads')"><div class="stat-label">Total Leads</div><div class="stat-num">${leads.length}</div><div class="stat-change">↑ ${nv} sin contactar</div></div>
    <div class="stat-card gold" onclick="goPage('metricas')"><div class="stat-label">Conversión</div><div class="stat-num">${cr}%</div><div class="stat-change" style="color:#d4a017">${rv} reservados</div></div>
    <div class="stat-card info" onclick="goPage('informes')"><div class="stat-label">Ventas Junio</div><div class="stat-num" style="color:#1d4ed8">${reservas.filter(r=>r.mes==='Junio').length+escrituras.filter(e=>e.mes==='Junio').length}</div><div class="stat-change" style="color:#1d4ed8">${reservas.filter(r=>r.mes==='Junio').length} res + ${escrituras.filter(e=>e.mes==='Junio').length} esc</div></div>
    <div class="stat-card warn" onclick="goPage('tasks')"><div class="stat-label">Tareas Pend.</div><div class="stat-num" style="color:#d97706">${pt}</div><div class="stat-change" style="color:#d97706">${dt} completadas</div></div>
  </div>
  <div class="grid2" style="margin-bottom:1rem">
    <div class="card"><div class="card-header"><div class="card-title">Leads por Estado</div><button class="btn btn-outline btn-sm" onclick="goPage('metricas')">Ver métricas</button></div>
      ${buildDonut([{label:'Nuevos',val:nv,color:'#1d4ed8'},{label:'Contactados',val:ct,color:'#1e3a8a'},{label:'Seguimiento',val:sg,color:'#d4a017'},{label:'Reservados',val:rv,color:'#3b82f6'},{label:'Descartados',val:ds,color:'#dc2626'}].filter(s=>s.val>0))}
    </div>
    <div class="card"><div class="card-header"><div class="card-title">Leads por Proyecto</div></div>${pd.length?buildBar(pd):'<div style="text-align:center;color:#475569;padding:1rem">Sin datos</div>'}</div>
  </div>
  <div class="grid2">
    <div class="card"><div class="card-header"><div class="card-title">⚡ Leads Recientes</div><button class="btn btn-outline btn-sm" onclick="goPage('leads')">Ver todos</button></div>${recHtml||'<div class="text-muted" style="padding:1rem">Sin leads</div>'}</div>
    <div class="card"><div class="card-header"><div class="card-title">🏆 Top Asesores</div><button class="btn btn-outline btn-sm" onclick="goPage('informes')">Ranking</button></div>${rankHtml||'<div class="text-muted" style="padding:1rem">Sin datos</div>'}</div>
  </div>`;
}
function bindDash() {}

let leadsFilter = {search:'',proj:'',status:'',adv:''};
let leadsModal = null; // 'add'|'edit'|'bulk'
let selectedLead = null;
let bulkRows = [];

function renderLeads() {
  const {leads, projects, advisors} = STATE;
  const filt = leads.filter(l => {
    const s = leadsFilter.search.toLowerCase();
    return (!s || l.name.toLowerCase().includes(s)||l.email.toLowerCase().includes(s)||l.phone.includes(s))
      && (!leadsFilter.proj || l.project===leadsFilter.proj)
      && (!leadsFilter.status || l.status===leadsFilter.status)
      && (!leadsFilter.adv || l.advisorId===leadsFilter.adv);
  });
  const projOpts = projects.map(p=>`<option value="${escHtml(p)}" ${leadsFilter.proj===p?'selected':''}>${escHtml(p)}</option>`).join('');
  const statOpts = SOPT.map(s=>`<option value="${s}" ${leadsFilter.status===s?'selected':''}>${s}</option>`).join('');
  const advOpts = advisors.map(a=>`<option value="${a.id}" ${leadsFilter.adv===a.id?'selected':''}>${escHtml(a.name)}</option>`).join('');
  const rows = filt.map(l => {
    const adv = advisors.find(a=>a.id===l.advisorId);
    return `<tr>
      <td><div class="fw6">${escHtml(l.name)}</div><div class="text-muted">${escHtml(l.source)}</div></td>
      <td><div class="text-sm">${escHtml(l.email)}</div><div class="text-muted">${escHtml(l.phone)}</div></td>
      <td><span class="tag">${escHtml(l.project)}</span></td>
      <td class="text-sm">${escHtml(l.budget)||'—'}</td>
      <td><span class="badge ${SCOL[l.status]||'badge-gray'}">${l.status}</span></td>
      <td class="text-sm">${adv?escHtml(adv.name):'<span style="color:#94a3b8">Sin asignar</span>'}</td>
      <td class="text-muted">${l.date}</td>
      <td><div class="action-btns"><button class="btn btn-outline btn-xs" onclick="openEditLead('${l.id}')">Ver</button><button class="btn btn-danger btn-xs" onclick="deleteLead('${l.id}')">✕</button></div></td>
    </tr>`;
  }).join('');

  let modalHtml = '';
  if (leadsModal === 'edit' && selectedLead) modalHtml = renderLeadModal(selectedLead);
  else if (leadsModal === 'add') modalHtml = renderAddLeadModal();
  else if (leadsModal === 'bulk') modalHtml = renderBulkModal();

  return `<div class="card">
    <div class="card-header">
      <div class="flex" style="gap:6px;flex-wrap:wrap">
        <input class="search" placeholder="🔍 Buscar..." value="${escHtml(leadsFilter.search)}" oninput="leadsFilter.search=this.value;reRenderLeads()" style="width:160px"/>
        <select class="search" onchange="leadsFilter.proj=this.value;reRenderLeads()"><option value="">Todos los proyectos</option>${projOpts}</select>
        <select class="search" onchange="leadsFilter.status=this.value;reRenderLeads()"><option value="">Todos los estados</option>${statOpts}</select>
        <select class="search" onchange="leadsFilter.adv=this.value;reRenderLeads()"><option value="">Todos los asesores</option>${advOpts}</select>
      </div>
      <div class="flex">
        <button class="btn btn-outline btn-sm" onclick="openBulkModal()">📋 Cargar leads del día</button>
        <button class="btn btn-primary btn-sm" onclick="openAddLead()">+ Agregar</button>
      </div>
    </div>
    <div style="overflow-x:auto"><table><thead><tr><th>Nombre</th><th>Contacto</th><th>Proyecto</th><th>Presupuesto</th><th>Estado</th><th>Asesor</th><th>Fecha</th><th></th></tr></thead><tbody>
    ${rows||'<tr><td colspan="8" style="text-align:center;color:#475569;padding:2rem">Sin resultados</td></tr>'}
    </tbody></table></div>
    <div class="text-muted mt1">${filt.length} de ${leads.length} leads</div>
  </div>
  ${modalHtml}`;
}

function reRenderLeads() {
  document.querySelector('.page-content').innerHTML = renderLeads();
  bindLeads();
}

  const rowsHtml = bulkRows.map((r,i)=>`<tr>
    <td><input style="width:140px;padding:5px 8px;border:1.5px solid #cbd5e1;border-radius:6px;font-size:12px;font-family:Outfit,sans-serif" value="${escHtml(r.name)}" oninput="bulkRows[${i}].name=this.value" placeholder="Nombre completo"/></td>

    <td><input style="width:150px;padding:5px 8px;border:1.5px solid #cbd5e1;border-radius:6px;font-size:12px;font-family:Outfit,sans-serif" value="${escHtml(r.email)}" oninput="bulkRows[${i}].email=this.value" placeholder="correo@..."/></td>
    <td><select style="padding:5px 8px;border:1.5px solid #cbd5e1;border-radius:6px;font-size:12px;font-family:Outfit,sans-serif" onchange="bulkRows[${i}].project=this.value">${projOpts}</select></td>

      <div class="modal-title">📋 Cargar Leads del Día</div>

}

function bindLeads() {}
function openEditLead(id) { selectedLead = {...STATE.leads.find(l=>l.id===id)}; leadsModal='edit'; reRenderLeads(); }
function openAddLead() { leadsModal='add'; reRenderLeads(); }
function openBulkModal() { bulkRows=[{name:'',phone:'',email:'',project:STATE.projects[0]||'',budget:'',source:'Factor Digital'}]; leadsModal='bulk'; reRenderLeads(); }
function closeLeadModal() { leadsModal=null; selectedLead=null; reRenderLeads(); }
function addBulkRow() { bulkRows.push({name:'',phone:'',email:'',project:STATE.projects[0]||'',budget:'',source:'Factor Digital'}); reRenderLeads(); }
function removeBulkRow(i) { bulkRows.splice(i,1); reRenderLeads(); }

async function saveLeadEdit(id) {
  const updated = {
    ...STATE.leads.find(l=>l.id===id),
    name: document.getElementById('le-name').value,
    phone: document.getElementById('le-phone').value,
    email: document.getElementById('le-email').value,
    budget: document.getElementById('le-budget').value,
    motivation: document.getElementById('le-motivation').value,
    project: document.getElementById('le-project').value,
    status: document.getElementById('le-status').value,
    advisorId: document.getElementById('le-adv').value || null,
    notes: document.getElementById('le-notes').value
  };
  STATE.leads = STATE.leads.map(l=>l.id===id?updated:l);
  await sbSet('eb_leads', STATE.leads);
  closeLeadModal();
}

async function saveAddLead() {
  const name = document.getElementById('al-name').value.trim();
  if (!name) { alert('El nombre es obligatorio'); return; }
  const nl = {
    id: uid(), name,
    phone: document.getElementById('al-phone').value,
    email: document.getElementById('al-email').value,
    budget: document.getElementById('al-budget').value,
    motivation: document.getElementById('al-mot').value,
    project: document.getElementById('al-proj').value,
    status:'Nuevo', source:'Manual', date:today(), advisorId:null, notes:''
  };
  STATE.leads = [...STATE.leads, nl];
  await sbSet('eb_leads', STATE.leads);
  closeLeadModal();
}

async function saveBulk() {
  const valid = bulkRows.filter(r=>r.name.trim());
  if (!valid.length) { alert('Al menos un nombre'); return; }
  const newLeads = valid.map(r=>({...r, id:uid(), date:today(), status:'Nuevo', advisorId:null, notes:'', motivation:''}));
  STATE.leads = [...STATE.leads, ...newLeads];
  await sbSet('eb_leads', STATE.leads);
  closeLeadModal();
}

async function deleteLead(id) {
  if (!confirm('¿Eliminar este lead?')) return;
  STATE.leads = STATE.leads.filter(l=>l.id!==id);
  await sbSet('eb_leads', STATE.leads);
  reRenderLeads();
}

    </div>
    ${err ? `<div class="error-msg" style="margin-bottom:.8rem">${escHtml(err)}</div>` : ''}
    <button class="btn btn-gold" id="parse-btn" onclick="parseEmail()" ${loading?'disabled':''}>
      ${loading ? '🔄 Procesando...' : '🤖 Extraer datos con IA'}
    </button>

// Extracción LOCAL: instantánea, sin internet y sin costo de créditos.
// Lee el texto pegado del correo y detecta los datos del lead automáticamente.
async function parseEmail() {
  importState.text = document.getElementById('import-text').value;
  const txt = importState.text.trim();
  if (!txt) { importState.err='Pega el texto del correo primero'; reRenderImport(); return; }
  importState.err=''; importState.extracted=null; importState.added=false;

  // Email
  const email = (txt.match(/[\w.+-]+@[\w-]+\.[\w.-]+/) || [''])[0];

  // Teléfono chileno (+56 9 xxxx xxxx, 9xxxxxxxx, etc.)
  let phone = '';
  const mPhone = txt.match(/(\+?56)?\s*9[\s.\-]?\d{4}[\s.\-]?\d{4}/);
  if (mPhone) phone = mPhone[0].replace(/[\s.\-]/g,'');

  // Nombre: busca "Nombre:" o toma la primera línea corta sin @ ni números
  let name = '';
  const mName = txt.match(/nombre[:\s]+([^\n\r]+)/i);
  if (mName) name = mName[1].trim();
  else {
    const linea = txt.split(/\n/).map(l=>l.trim())
      .find(l => l && !l.includes('@') && !/\d{4}/.test(l) && l.length < 40);
    if (linea) name = linea;
  }

  // Presupuesto
  let budget = '';
  const mBud = txt.match(/(presupuesto|budget|invertir|monto)[:\s]*([^\n\r]+)/i);
  if (mBud) budget = mBud[2].trim();
  else { const mUf = txt.match(/(\$[\d.,]+|\d+\s*(millones|uf|mm))/i); if (mUf) budget = mUf[0]; }

  // Motivación
  let motivation = '';
  const mMot = txt.match(/(motivaci[oó]n|interesad|busca|raz[oó]n)[:\s]*([^\n\r]+)/i);
  if (mMot) motivation = (mMot[2]||'').trim();

  // Proyecto: coincide con los proyectos ya cargados
  const project = STATE.projects.find(p => txt.toLowerCase().includes((p||'').toLowerCase()))
                  || (STATE.projects[0] || '');

  importState.extracted = {name, email, phone, budget, motivation, project};
  reRenderImport();
}

async function confirmImport() {
  const ep = {
    name: document.getElementById('ep-name').value,
    phone: document.getElementById('ep-phone').value,
    email: document.getElementById('ep-email').value,
    budget: document.getElementById('ep-budget').value,
    motivation: document.getElementById('ep-mot').value,
    project: document.getElementById('ep-proj').value
  };

  // ---- ASIGNACIÓN AUTOMÁTICA ----
  // Reparte el lead al asesor con MENOS tareas activas (carga balanceada).
  let advisorId = null, advName = '';
  if (STATE.advisors && STATE.advisors.length) {
    const carga = STATE.advisors.map(a => ({
      a, n: STATE.tasks.filter(t => t.advisorId === a.id && t.status !== 'Completada').length
    }));
    carga.sort((x,y) => x.n - y.n);
    advisorId = carga[0].a.id;
    advName = carga[0].a.name;
  }

  const lead = {...ep, id:uid(), status:'Nuevo', source:'Factor Digital', date:today(), advisorId, notes:''};
  STATE.leads = [...STATE.leads, lead];
  await sbSet('eb_leads', STATE.leads);

  // ---- TAREA AUTOMÁTICA ----
  // El asesor recibe al instante el contacto a trabajar, con vencimiento a 24 h.
  if (advisorId) {
    const venc = new Date(Date.now() + 24*60*60*1000).toISOString().split('T')[0];
    const tarea = {
      id: uid(),
      title: 'Contactar nuevo lead: ' + (ep.name || 'sin nombre'),
      description: `📞 ${ep.phone||'—'}  ·  ✉️ ${ep.email||'—'}  ·  💰 ${ep.budget||'—'}\nMotivación: ${ep.motivation||'—'}`,
      advisorId, project: ep.project, dueDate: venc, status: 'Pendiente', date: today()
    };
    STATE.tasks = [...STATE.tasks, tarea];
    await sbSet('eb_tasks', STATE.tasks);
  }

  importState.extracted = {...ep, _adv: advName};
  importState.added = true;
  reRenderImport();
}

function reRenderImport() {
  document.querySelector('.page-content').innerHTML = renderImport();
  bindImport();
}

    <div class="card-header">

        <select class="search" onchange="tasksFilter.adv=this.value;reRenderTasks()"><option value="">Todos los asesores</option>${advOpts}</select>

async function saveTask() {
  const title = document.getElementById('at-title').value.trim();
  const advisorId = document.getElementById('at-adv').value;
  const err = document.getElementById('at-err');
  if (!title) { err.textContent='Título requerido'; err.style.display='block'; return; }
  if (!advisorId) { err.textContent='Selecciona un asesor'; err.style.display='block'; return; }
  const nt = {id:uid(), title, description:document.getElementById('at-desc').value, advisorId, project:document.getElementById('at-proj').value, dueDate:document.getElementById('at-date').value, status:'Pendiente', date:today()};
  STATE.tasks = [...STATE.tasks, nt];
  await sbSet('eb_tasks', STATE.tasks);
  showAddTask = false;
  reRenderTasks();
}

async function deleteTask(id) {
  if (!confirm('¿Eliminar esta tarea?')) return;
  STATE.tasks = STATE.tasks.filter(t=>t.id!==id);
  await sbSet('eb_tasks', STATE.tasks);
  reRenderTasks();
}

async function saveNewAdvisor() {
  const name=document.getElementById('na-name').value.trim();
  const code=document.getElementById('na-code').value.trim().toUpperCase();
  const pass=document.getElementById('na-pass').value.trim();
  if (!name||!code||!pass) { advErr='Todos los campos requeridos'; reRenderPage(); return; }
  if (STATE.advisors.find(a=>a.code.toUpperCase()===code)) { advErr='Código ya existe'; reRenderPage(); return; }
  STATE.advisors = [...STATE.advisors, {id:uid(),name,code,pass}];
  await sbSet('eb_advisors', STATE.advisors);
  showAddAdvisor=false; advErr=''; reRenderPage();
}

async function saveNewPassword() {
  const newpass = document.getElementById('ep-newpass').value;
  if (!newpass || newpass.length<6) { alert('Mínimo 6 caracteres'); return; }
  STATE.advisors = STATE.advisors.map(a=>a.id===editPasswordId?{...a,pass:newpass}:a);
  await sbSet('eb_advisors', STATE.advisors);
  editPasswordId=null; alert('✅ Contraseña actualizada'); reRenderPage();
}

async function deleteAdvisor(id) {
  if (!confirm('¿Eliminar este asesor?')) return;
  STATE.advisors = STATE.advisors.filter(a=>a.id!==id);
  await sbSet('eb_advisors', STATE.advisors);
  reRenderPage();
}

// ===== Alerta de escrituras: cuántos días lleva reservada sin escriturar =====
function diasReservada(fecha){
  if(!fecha) return 0;
  const d = new Date(fecha+'T00:00:00');
  const hoy = new Date(today()+'T00:00:00');
  return Math.max(0, Math.round((hoy-d)/86400000));
}
// ¿esta parcela reservada ya tiene una escritura registrada? (mismo proyecto + parcela)
function estaEscriturada(r){
  const k = s=>(s||'').toString().trim().toLowerCase();
  return STATE.escrituras.some(e=>k(e.proyecto)===k(r.proyecto) && k(e.parcela)===k(r.parcela));
}
// badge de color según los días sin escriturar
function badgeReserva(r){
  if(estaEscriturada(r)) return '<span style="background:#dbeafe;color:#1e40af;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap">✅ Escriturada</span>';
  const d = diasReservada(r.fecha);
  let bg,c,ico;
  if(d>=15){bg='#fee2e2';c='#991b1b';ico='🔴 ';}
  else if(d>=7){bg='#fef9c3';c='#854d0e';ico='🟡 ';}
  else {bg='#dcfce7';c='#166534';ico='🟢 ';}
  return `<span style="background:${bg};color:${c};padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap">${ico}${d} día${d===1?'':'s'} sin escriturar</span>`;
}

function openAddVenta() { ventasState.showAdd=true; ventasState.editId=null; ventasState.err=''; ventasState.form={mes:'',proyecto:'',parcela:'',asesores:'',lead:'',fecha:today()}; reRenderVentas(STATE.page); }
function closeAddVenta() { ventasState.showAdd=false; ventasState.editId=null; ventasState.err=''; reRenderVentas(STATE.page); }

function editVenta(tipo, id) {
  const ventas = tipo==='reserva' ? STATE.reservas : STATE.escrituras;
  const v = ventas.find(x=>x.id===id);
  if (!v) return;
  ventasState.form = {...v};
  ventasState.editId = id;
  ventasState.showAdd = true;
  ventasState.err = '';
  reRenderVentas(tipo);
}

async function saveVenta(tipo) {
  const mes = document.getElementById('vf-mes').value;
  const proyecto = document.getElementById('vf-proj').value;
  const parcela = document.getElementById('vf-parcela').value.trim();
  const asesores = document.getElementById('vf-asesores').value.trim();
  if (!proyecto||!parcela||!asesores||!mes) { ventasState.err='Campos obligatorios faltantes'; reRenderVentas(tipo); return; }
  const entry = {mes, proyecto, parcela, asesores, lead:document.getElementById('vf-lead').value, fecha:document.getElementById('vf-fecha').value, id:ventasState.editId||uid()};
  if (tipo==='reserva') {
    STATE.reservas = ventasState.editId ? STATE.reservas.map(v=>v.id===ventasState.editId?entry:v) : [...STATE.reservas, entry];
    await sbSet('eb_reservas', STATE.reservas);
  } else {
    STATE.escrituras = ventasState.editId ? STATE.escrituras.map(v=>v.id===ventasState.editId?entry:v) : [...STATE.escrituras, entry];
    await sbSet('eb_escrituras', STATE.escrituras);
  }
  ventasState.showAdd=false; ventasState.editId=null; ventasState.err='';
  reRenderVentas(tipo);
}

async function deleteVenta(tipo, id) {
  if (!confirm('¿Eliminar?')) return;
  if (tipo==='reserva') { STATE.reservas=STATE.reservas.filter(v=>v.id!==id); await sbSet('eb_reservas',STATE.reservas); }
  else { STATE.escrituras=STATE.escrituras.filter(v=>v.id!==id); await sbSet('eb_escrituras',STATE.escrituras); }
  reRenderVentas(tipo);
}

    const data = await r.json();
    informesAI = (data.content||[]).map(i=>i.text||'').join('') || 'Sin respuesta';
  } catch(e) { informesAI='❌ Error de conexión.'; }
  informesLoadingAI=false; reRenderInformes();
}

// ===================== ANÁLISIS IA =====================
let aiState = {q:'', resp:'', loading:false, err:''};
const AI_PRESETS = ['Resumen ejecutivo del CRM','Rendimiento de asesores','Leads con mayor potencial','Acciones prioritarias esta semana','Cómo mejorar conversión'];

function renderAI() {
  const {q, resp, loading, err} = aiState;
  const presets = AI_PRESETS.map(p=>`<button class="btn btn-outline btn-sm" style="font-size:11px" onclick="askAIPreset('${escHtml(p)}')">${escHtml(p)}</button>`).join('');
  return `<div class="card">
    <div class="card-header"><div><div class="card-title">🤖 Análisis con IA</div><div class="card-subtitle">Consultas estratégicas con contexto del CRM</div></div></div>
    <div style="display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1rem">${presets}</div>
    <div style="display:flex;gap:.5rem">
      <input class="search" style="flex:1" id="ai-q" value="${escHtml(q)}" placeholder="Escribe tu pregunta..." onkeydown="if(event.key==='Enter')askAI()"/>
      <button class="btn btn-gold" onclick="askAI()" ${loading?'disabled':''}>${loading?'⏳':'Consultar'}</button>
    </div>
    ${err?`<div class="error-msg mt1">${escHtml(err)}</div>`:''}
    ${loading?`<div class="ai-box mt1"><div class="ai-header">🤖 Analizando</div>Procesando...</div>`:''}
    ${resp?`<div class="ai-box mt1"><div class="ai-header">🤖 Respuesta</div>${escHtml(resp)}</div>`:''}
  </div>`;
}

function bindAI() {
  const inp = document.getElementById('ai-q');
  if (inp) inp.addEventListener('input', ()=>{ aiState.q=inp.value; });
}

function reRenderAI() { document.querySelector('.page-content').innerHTML = renderAI(); bindAI(); }

async function askAI(q) {
  const question = q || aiState.q;
  if (!question.trim()) return;
  aiState.q = question; aiState.loading=true; aiState.err=''; aiState.resp='';
  reRenderAI();
  const {leads, tasks, advisors, projects} = STATE;
  const ctx = `Energy Bless División Parcelas. Leads:${leads.length}(Nuevos:${leads.filter(l=>l.status==='Nuevo').length},Reservados:${leads.filter(l=>l.status==='Reservado').length}). Tareas:${tasks.length}(Pend:${tasks.filter(t=>t.status!=='Completada').length}). Asesores:${advisors.length}. Proyectos:${projects.join(',')}`;
  try {
    const r = await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','anthropic-version':'2023-06-01'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,messages:[{role:'user',content:`Eres asesor estratégico de Energy Bless Chile. Responde en español con análisis concreto para Giannina Lazo.\n\nContexto: ${ctx}\n\nConsulta: ${question}`}]})});
    const data = await r.json();
    aiState.resp = (data.content||[]).map(i=>i.text||'').join('') || 'Sin respuesta';
  } catch(e) { aiState.err='Error de conexión.'; }
  aiState.loading=false; reRenderAI();
}

function askAIPreset(p) { aiState.q=p; askAI(p); }

// ===================== PORTAL ASESOR =====================
let advTab = 'p';
let openTaskId = null;
let taskReport = {};
let taskNext = {};

function renderAdvisorPortal() {
  const {user, tasks} = STATE;
  const my = tasks.filter(t=>t.advisorId===user.id);
  const pend = my.filter(t=>t.status!=='Completada');
  const done = my.filter(t=>t.status==='Completada');
  const tab = advTab;

  const taskCards = (list, isDone) => list.map(t => {
    if (isDone) return `<div class="task-card done">
      <div class="task-header"><span class="task-title">${escHtml(t.title)}</span><span class="badge badge-green">✓</span></div>
      <div class="task-body">${escHtml(t.description)}</div>
      <div style="margin-top:.8rem;padding:.9rem;background:#eff6ff;border-radius:9px;font-size:13px"><b>Reporte:</b> ${escHtml(t.report)} ${t.nextContact?`<div><b>Próximo:</b> ${escHtml(t.nextContact)}</div>`:''}</div>
    </div>`;
    const isOpen = openTaskId===t.id;
    return `<div class="task-card">
      <div class="task-header"><span class="task-title">${escHtml(t.title)}</span><span class="badge ${SCOL[t.status]||'badge-gray'}">${t.status||'Pendiente'}</span></div>
      <div class="task-body">${escHtml(t.description)}</div>
      <div class="flex mt1">${t.project?`<span class="tag">📍 ${escHtml(t.project)}</span>`:''} ${t.dueDate?`<span class="text-muted">📅 ${t.dueDate}</span>`:''}</div>
      ${!isOpen?`<button class="btn btn-primary btn-sm mt2" onclick="openAdvTask('${t.id}')">📝 Reportar</button>`:`
      <div class="task-form">
        <div class="field"><label>Resultado *</label><textarea id="tr-${t.id}" placeholder="Describe el resultado...">${escHtml(taskReport[t.id]||'')}</textarea></div>
        <div class="field"><label>Próximo contacto</label><input id="tn-${t.id}" value="${escHtml(taskNext[t.id]||'')}"/></div>
        <div id="terr-${t.id}" class="err" style="display:none">Requerido</div>
        <div class="flex mt1">
          <button class="btn btn-primary btn-sm" onclick="submitTask('${t.id}')">✅ Enviar</button>
          <button class="btn btn-outline btn-sm" onclick="closeAdvTask()">Cancelar</button>
        </div>
      </div>`}
    </div>`;
  }).join('');

  return `<div class="advisor-portal">
    <div class="advisor-header">
      <div>
        <div style="font-family:Cormorant Garamond,serif;font-size:18px;font-weight:700">🌿 Energy Bless · Portal Asesor</div>
        <div style="font-size:12px;color:#bfdbfe;margin-top:2px">${escHtml(user.name)} — ${escHtml(user.code)}</div>
      </div>
      <button class="btn btn-sm" style="background:rgba(255,255,255,0.15);color:#fff;border:1px solid rgba(255,255,255,0.3)" onclick="logout()">Cerrar sesión</button>
    </div>
    <div class="advisor-content">
      <div class="grid2" style="margin-bottom:1rem">
        <div class="stat-card"><div class="stat-label">Pendientes</div><div class="stat-num">${pend.length}</div></div>
        <div class="stat-card gold"><div class="stat-label">Completadas</div><div class="stat-num">${done.length}</div></div>
      </div>
      <div class="tabs">
        <div class="tab ${tab==='p'?'active':''}" onclick="switchAdvTab('p')">Pendientes (${pend.length})</div>
        <div class="tab ${tab==='d'?'active':''}" onclick="switchAdvTab('d')">Completadas (${done.length})</div>
      </div>
      ${tab==='p'?(!pend.length?`<div class="card" style="text-align:center;padding:2rem;color:#475569">✅ Sin tareas pendientes</div>`:taskCards(pend,false))
        :(!done.length?`<div class="card" style="text-align:center;padding:2rem;color:#475569">Sin completadas</div>`:taskCards(done,true))}
    </div>
  </div>`;
}

function bindAdvisorPortal() {}

function switchAdvTab(t) { advTab=t; render(); }
function openAdvTask(id) { openTaskId=id; render(); }
function closeAdvTask() { openTaskId=null; render(); }

async function submitTask(id) {
  const rep = document.getElementById('tr-'+id).value.trim();
  const nxt = document.getElementById('tn-'+id).value;
  if (!rep) { document.getElementById('terr-'+id).style.display='block'; return; }
  STATE.tasks = STATE.tasks.map(t=>t.id===id?{...t,status:'Completada',report:rep,nextContact:nxt,reportDate:new Date().toLocaleDateString('es-CL')}:t);
  await sbSet('eb_tasks', STATE.tasks);
  openTaskId=null; render();
}

// ===================== ARRANQUE =====================
render();
</script>
