const SB_HEADERS={'Content-Type':'application/json','apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Prefer':'return=representation'};

async function sbGet(table,init){
  try{
    const r=await fetch(`${SUPA_URL}/rest/v1/${table}?select=*`,{headers:SB_HEADERS});
    const rows=await r.json();
    if(!Array.isArray(rows)||rows.length===0)return init;
    // Si la tabla tiene estructura {id, data}, devolver array de data
    if(rows[0]&&rows[0].data!==undefined) return rows.map(r=>r.data);
    return rows;
  }catch(e){console.error('sbGet error',e);return init;}
}

async function sbSet(table,arr){
  try{
    // Upsert todo el array como filas {id, data}
    const rows=arr.map(item=>({id:item.id||('r'+Math.random()),data:item}));
    await fetch(`${SUPA_URL}/rest/v1/${table}`,{
      method:'POST',
      headers:{...SB_HEADERS,'Prefer':'resolution=merge-duplicates'},
      body:JSON.stringify(rows)
    });
  }catch(e){console.error('sbSet error',e);}
}

async function sbDelete(table,id){
  try{
    await fetch(`${SUPA_URL}/rest/v1/${table}?id=eq.${id}`,{method:'DELETE',headers:SB_HEADERS});
  }catch(e){console.error('sbDelete error',e);}
}

    sbGet('eb_tasks',[]).then(t=>{setTasks(t);setLoading(false);});
  },[]);

  const myTasks=tasks.filter(t=>t.advisorId===user.id);
  const pending=myTasks.filter(t=>t.status!=='Completada');
  const done=myTasks.filter(t=>t.status==='Completada');

  const[showChangePwd,setShowChangePwd]=useState(false);
  const[oldPwd,setOldPwd]=useState('');
  const[newPwd,setNewPwd]=useState('');
  const[newPwd2,setNewPwd2]=useState('');
  const[pwdMsg,setPwdMsg]=useState('');

  async function changePassword(){
    if(oldPwd!==user.pass){setPwdMsg('❌ Contraseña actual incorrecta');return;}
    if(newPwd.length<6){setPwdMsg('❌ La nueva contraseña debe tener al menos 6 caracteres');return;}
    if(newPwd!==newPwd2){setPwdMsg('❌ Las contraseñas no coinciden');return;}
    const advisors=await sbGet('eb_advisors',ADVISORS_INIT);
    const updated=advisors.map(a=>a.id===user.id?{...a,pass:newPwd}:a);
    await sbSet('eb_advisors',updated);
    user.pass=newPwd;
    setPwdMsg('✅ Contraseña cambiada exitosamente');

          <div className="stat-card"><div className="stat-label">Tareas pendientes</div><div className="stat-num">{pending.length}</div></div>
          <div className="stat-card gold"><div className="stat-label">Completadas</div><div className="stat-num" style={{color:'var(--gold)'}}>{done.length}</div></div>
        </div>
        <div className="tabs">
          <div className={`tab ${tab==='pending'?'active':''}`} onClick={()=>setTab('pending')}>Pendientes ({pending.length})</div>
          <div className={`tab ${tab==='done'?'active':''}`} onClick={()=>setTab('done')}>Completadas ({done.length})</div>
        </div>
        {tab==='pending'&&(
          pending.length===0
            ?<div className="card" style={{textAlign:'center',color:'var(--muted)',padding:'2rem'}}>✅ No tienes tareas pendientes</div>
            :pending.map(t=><AdvisorTaskCard key={t.id} task={t} onSubmit={submitReport}/>)
        )}
        {tab==='done'&&(
          done.length===0
            ?<div className="card" style={{textAlign:'center',color:'var(--muted)',padding:'2rem'}}>Sin tareas completadas aún</div>
            :done.map(t=>(
              <div key={t.id} className="task-card done">
                <div className="task-header"><span className="task-title">{t.title}</span><span className="badge badge-green">✓ Completada</span></div>
                <div className="task-body" style={{marginBottom:'.5rem'}}>{t.description}</div>

        )}
      </div>
    </div>
  );
}

function AdvisorTaskCard({task,onSubmit}){
  const[open,setOpen]=useState(false);
  const[report,setReport]=useState('');
  const[next,setNext]=useState('');
  const[err,setErr]=useState('');

  function submit(){
    if(!report.trim()){setErr('Debes describir el resultado');return;}
    onSubmit(task.id,report,next);setOpen(false);
  }

  return(
    <div className="task-card">
      <div className="task-header">
        <span className="task-title">{task.title}</span>
        <span className={`badge ${STATUS_COLORS[task.status]||'badge-gray'}`}>{task.status||'Pendiente'}</span>
      </div>
      <div className="task-body">{task.description}</div>
      <div className="flex mt1">
        {task.project&&<span className="tag">📍 {task.project}</span>}
        {task.dueDate&&<span className="text-muted">📅 Vence: {task.dueDate}</span>}
      </div>
      {!open&&<button className="btn btn-primary btn-sm mt2" onClick={()=>setOpen(true)}>📝 Reportar resultado</button>}
      {open&&(
        <div className="task-form">
          <div className="field">
            <label>¿Qué realizaste? Describe el resultado *</label>
            <textarea value={report} onChange={e=>setReport(e.target.value)} placeholder="Ej: Llamé al cliente el lunes, mostró interés en la parcela, le envié ficha técnica de Caone. Quedamos en hablar el miércoles para agendar visita."/>
          </div>
          <div className="field">
            <label>Próximo contacto / acción programada</label>
            <input value={next} onChange={e=>setNext(e.target.value)} placeholder="Ej: Miércoles 11 jun — llamar para agendar visita presencial"/>
          </div>
          {err&&<div className="error-msg" style={{marginBottom:'.5rem'}}>{err}</div>}
          <div className="flex">
            <button className="btn btn-primary btn-sm" onClick={submit}>✅ Enviar reporte</button>
            <button className="btn btn-outline btn-sm" onClick={()=>{setOpen(false);setErr('')}}>Cancelar</button>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── MINI CHART HELPERS ──────────────────────────
function BarChart({data,color='var(--green)',height=80}){
  if(!data||data.length===0)return null;
  const max=Math.max(...data.map(d=>d.val),1);
  const w=Math.floor(340/data.length)-4;
  return(
    <svg width="100%" viewBox={`0 0 340 ${height+24}`} style={{overflow:'visible'}}>
      {data.map((d,i)=>{
        const barH=Math.max(2,Math.round(d.val/max*height));
        const x=i*(w+4)+2;
        const y=height-barH;
        return(
          <g key={i}>
            <rect x={x} y={y} width={w} height={barH} rx="3" fill={color} opacity=".85"/>
            <text x={x+w/2} y={height+12} textAnchor="middle" fontSize="9" fill="var(--muted)" fontFamily="DM Sans,sans-serif">{d.label}</text>
            {d.val>0&&<text x={x+w/2} y={y-3} textAnchor="middle" fontSize="9" fill={color} fontFamily="DM Sans,sans-serif" fontWeight="600">{d.val}</text>}
          </g>
        );
      })}
    </svg>
  );
}

function DonutChart({slices,size=110}){
  const total=slices.reduce((s,x)=>s+x.val,0);
  if(total===0)return<div style={{textAlign:'center',color:'var(--muted)',padding:'1rem',fontSize:'12px'}}>Sin datos</div>;
  let angle=-90;
  const cx=size/2,cy=size/2,r=size*0.38,inner=size*0.22;
  const paths=slices.map(s=>{
    const pct=s.val/total;
    const a1=angle,a2=angle+pct*360;
    angle=a2;
    const toRad=deg=>deg*Math.PI/180;
    const x1=cx+r*Math.cos(toRad(a1)),y1=cy+r*Math.sin(toRad(a1));
    const x2=cx+r*Math.cos(toRad(a2)),y2=cy+r*Math.sin(toRad(a2));
    const xi1=cx+inner*Math.cos(toRad(a1)),yi1=cy+inner*Math.sin(toRad(a1));
    const xi2=cx+inner*Math.cos(toRad(a2)),yi2=cy+inner*Math.sin(toRad(a2));
    const large=pct>0.5?1:0;
    return{...s,d:`M${xi1},${yi1} L${x1},${y1} A${r},${r} 0 ${large},1 ${x2},${y2} L${xi2},${yi2} A${inner},${inner} 0 ${large},0 ${xi1},${yi1}Z`};
  });
  return(
    <div style={{display:'flex',alignItems:'center',gap:'1rem',flexWrap:'wrap'}}>
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{flexShrink:0}}>
        {paths.map((p,i)=><path key={i} d={p.d} fill={p.color} opacity=".9"/>)}
        <text x={cx} y={cy+4} textAnchor="middle" fontSize="13" fontWeight="700" fill="var(--green-dark)" fontFamily="Playfair Display,serif">{total}</text>
      </svg>
      <div style={{flex:1,minWidth:'100px'}}>
        {slices.map((s,i)=>(
          <div key={i} style={{display:'flex',alignItems:'center',gap:'6px',marginBottom:'4px',fontSize:'11px'}}>
            <div style={{width:'10px',height:'10px',borderRadius:'2px',background:s.color,flexShrink:0}}></div>
            <span style={{flex:1,color:'var(--text)'}}>{s.label}</span>
            <span style={{fontWeight:'600',color:s.color}}>{s.val}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function ImportPage({leads,setLeads,projects}){
  const[text,setText]=useState('');
  const[loading,setLoading]=useState(false);
  const[parsed,setParsed]=useState(null);
  const[editParsed,setEditParsed]=useState(null);
  const[added,setAdded]=useState(false);
  const[err,setErr]=useState('');

  async function parseWithAI(){
    if(!text.trim()){setErr('Pega el texto del correo primero');return;}
    setLoading(true);setErr('');setParsed(null);setAdded(false);setEditParsed(null);
    try{
      const res=await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          model:'claude-sonnet-4-20250514',
          max_tokens:800,
          messages:[{role:'user',content:`Extrae los datos de este correo de notificación de lead inmobiliario de Factor Digital y responde SOLO con JSON válido, sin backticks ni texto adicional:
{"name":"nombre completo","email":"correo electrónico","phone":"número con código país","motivation":"motivo de compra en español natural sin guiones bajos","budget":"rango de presupuesto limpio en pesos","project":"nombre del proyecto si aparece"}

Correo:
${text}`}]
        })
      });
      const data=await res.json();
      const raw=data.content?.map(i=>i.text||'').join('');
      const obj=JSON.parse(raw.replace(/```json|```/g,'').trim());
      setParsed(obj);setEditParsed({...obj});
    }catch(e){setErr('Error al procesar. Verifica que pegaste el texto completo del correo.');}
    setLoading(false);
  }

  function addLead(){
    if(!editParsed)return;
    const projMatch=projects.find(p=>p.toLowerCase().includes((editParsed.project||'').toLowerCase().substring(0,5)));
    const nl={...editParsed,id:'l'+Date.now(),project:projMatch||projects[0]||'',status:'Nuevo',source:'Factor Digital',date:new Date().toISOString().split('T')[0],advisorId:null,notes:''};
    setLeads([...leads,nl]);setAdded(true);
  }

  return(
    <div>
      <div className="card">
        <div className="card-title" style={{marginBottom:'.5rem'}}>📧 Importar Lead desde Correo de Factor Digital</div>
        <p className="text-muted" style={{marginBottom:'1rem',lineHeight:'1.6'}}>
          Cuando jorge.verdugo envíe un correo de notificación a Francisco Avello, copia el texto completo del correo y pégalo aquí. La IA extraerá automáticamente todos los datos del prospecto.
        </p>
        <div className="import-box">
          <div style={{fontSize:'13px',color:'var(--muted)',fontWeight:'500'}}>📋 Pega aquí el texto completo del correo</div>
          <textarea value={text} onChange={e=>setText(e.target.value)} placeholder={`Ejemplo de texto a pegar:\n\nHola Fran, llegó un nuevo Lead para [Factor Digital] Leads Praderas de Caone Audiencia Amplia - Dinámico - Praderas de Caone - Crédito Dinámico - Praderas de Caone - Crédito\nTe dejo los datos para contactarlo:\nBenja Ignacio\nbenjaaravenaa@gmail.com\n+56961348631\ntener_un_lugar_para_escapar_los_fines_de_semana\nentre_$8_y_$15_millones\nen_las_próximas_2_semanas`}/>
        </div>
        {err&&<div className="error-msg" style={{marginBottom:'.8rem'}}>{err}</div>}
        <button className="btn btn-gold" onClick={parseWithAI} disabled={loading} style={{padding:'11px 20px'}}>
          {loading?'🔄 Procesando con IA...':'🤖 Extraer datos automáticamente con IA'}
        </button>
      </div>

      {editParsed&&(
        <div className="card">
          <div className="card-title" style={{marginBottom:'1rem'}}>✅ Datos extraídos — revisa y edita si es necesario</div>
          <div className="grid2">
            <div className="field"><label>Nombre</label><input value={editParsed.name||''} onChange={e=>setEditParsed({...editParsed,name:e.target.value})}/></div>
            <div className="field"><label>Teléfono</label><input value={editParsed.phone||''} onChange={e=>setEditParsed({...editParsed,phone:e.target.value})}/></div>
            <div className="field"><label>Email</label><input value={editParsed.email||''} onChange={e=>setEditParsed({...editParsed,email:e.target.value})}/></div>
            <div className="field"><label>Presupuesto</label><input value={editParsed.budget||''} onChange={e=>setEditParsed({...editParsed,budget:e.target.value})}/></div>
          </div>
          <div className="field"><label>Motivación / interés</label><input value={editParsed.motivation||''} onChange={e=>setEditParsed({...editParsed,motivation:e.target.value})}/></div>
          <div className="field"><label>Proyecto detectado</label><input value={editParsed.project||''} onChange={e=>setEditParsed({...editParsed,project:e.target.value})}/></div>
          {!added
            ?<button className="btn btn-primary mt1" onClick={addLead}>➕ Confirmar y agregar al CRM</button>
            :<div className="info-box info-green mt1">✅ <strong>{editParsed.name}</strong> fue agregado exitosamente al CRM como lead Nuevo.</div>
          }
        </div>
      )}
    </div>
  );
}

    if(!newA.name||!newA.code||!newA.pass){setErr('Todos los campos son obligatorios');return;}
    if(advisors.find(a=>a.code.toUpperCase()===newA.code.toUpperCase())){setErr('Ese código ya existe');return;}
    setAdvisors([...advisors,{...newA,id:'a'+Date.now(),code:newA.code.toUpperCase()}]);
    setNewA({name:'',code:'',pass:''});setShowAdd(false);setErr('');
  }
  function remove(id){if(window.confirm('¿Eliminar este asesor?'))setAdvisors(advisors.filter(a=>a.id!==id));}
  const[editId,setEditId]=useState(null);
  const[editPassVal,setEditPassVal]=useState('');
  function editPass(id){setEditId(id);setEditPassVal('');}
  function savePass(){
    if(!editPassVal||editPassVal.length<6){alert('La contraseña debe tener al menos 6 caracteres');return;}
    setAdvisors(advisors.map(a=>a.id===editId?{...a,pass:editPassVal}:a));
    setEditId(null);setEditPassVal('');
    alert('✅ Contraseña actualizada correctamente');
  }

  return(
    <div>
      <div className="card">
        <div className="card-header">
          <div className="card-title">🧑‍💼 Equipo de Asesores</div>
          <button className="btn btn-primary btn-sm" onClick={()=>setShowAdd(true)}>+ Agregar asesor</button>
        </div>
        {showAdd&&(
          <div style={{padding:'1rem',background:'var(--green-pale)',borderRadius:'10px',marginBottom:'1rem',border:'1px solid var(--green-light)'}}>
            <div className="fw6" style={{marginBottom:'.8rem',color:'var(--green-dark)'}}>Nuevo asesor</div>
            <div className="grid2">
              <div className="field"><label>Nombre completo *</label><input value={newA.name} onChange={e=>setNewA({...newA,name:e.target.value})}/></div>
              <div className="field"><label>Código de acceso (2-4 letras) *</label><input value={newA.code} onChange={e=>setNewA({...newA,code:e.target.value})} placeholder="Ej: FC, AR, JM"/></div>
              <div className="field"><label>Contraseña portal asesor *</label><input value={newA.pass} onChange={e=>setNewA({...newA,pass:e.target.value})} placeholder="Contraseña que usará el asesor"/></div>
            </div>
            {err&&<div className="error-msg" style={{marginBottom:'.5rem'}}>{err}</div>}
            <div className="flex"><button className="btn btn-primary btn-sm" onClick={add}>Guardar asesor</button><button className="btn btn-outline btn-sm" onClick={()=>{setShowAdd(false);setErr('')}}>Cancelar</button></div>
          </div>
        )}
        <table>
          <thead><tr><th>Nombre</th><th>Código</th><th>Contraseña portal</th><th>Tareas totales</th><th>Completadas</th><th>Tasa éxito</th><th></th></tr></thead>
          <tbody>
            {advisors.map(a=>{
              const myT=tasks.filter(t=>t.advisorId===a.id);
              const done=myT.filter(t=>t.status==='Completada').length;
              const pct=myT.length>0?Math.round(done/myT.length*100):0;
              return(
                <tr key={a.id}>
                  <td className="fw6">{a.name}</td>
                  <td><span className="badge badge-green">{a.code}</span></td>
                  <td><code style={{background:'var(--bg)',padding:'2px 8px',borderRadius:'5px',fontSize:'12px'}}>{a.pass}</code></td>
                  <td>{myT.length}</td>
                  <td>{done}</td>
                  <td><span className={`badge ${pct>=70?'badge-green':pct>=40?'badge-gold':'badge-red'}`}>{pct}%</span></td>
                  <td style={{display:'flex',gap:'6px'}}><button className="btn btn-sm" style={{background:'var(--green)',color:'#fff',fontSize:'11px'}} onClick={()=>editPass(a.id)}>✏️ Clave</button><button className="btn btn-danger btn-sm" onClick={()=>remove(a.id)}>Eliminar</button></td>
                </tr>
              );
            })}
          </tbody>
        </table>
        <div className="info-box info-gold mt2">
          💡 Los asesores acceden al Portal Asesor con su <strong>código</strong> y <strong>contraseña</strong> desde cualquier dispositivo. Solo ven sus tareas asignadas: sin acceso a leads, estadísticas ni información del CRM administrativo.
        </div>
      </div>
    </div>
  );
}

function AIPage({leads,tasks,advisors,projects}){
  const[query,setQuery]=useState('');
  const[loading,setLoading]=useState(false);
  const[response,setResponse]=useState('');
  const[err,setErr]=useState('');

  const presets=[
    'Dame un resumen ejecutivo del estado actual del CRM',
    'Analiza el rendimiento de los asesores y sugiere mejoras',
    'Identifica los leads con mayor potencial de cierre',
    'Qué proyectos tienen más actividad esta semana',
    'Sugiere acciones de seguimiento prioritarias',
    'Cómo mejorar la tasa de conversión de leads a reserva',
  ];

  async function ask(q){
    const question=q||query;if(!question.trim())return;
    setLoading(true);setErr('');setResponse('');
    const ctx=`CRM Energy Bless - División Parcelas, Rancagua Chile. Subgerente de Ventas: Giannina Lazo. Gerente de Ventas: Francisco Avello. Gerente General: Paulina Palma.
Total leads: ${leads.length}. Nuevos: ${leads.filter(l=>l.status==='Nuevo').length}. Contactados: ${leads.filter(l=>l.status==='Contactado').length}. Reservados: ${leads.filter(l=>l.status==='Reservado').length}. Descartados: ${leads.filter(l=>l.status==='Descartado').length}.
Proyectos activos (${projects.length}): ${projects.join(', ')}.
Asesores (${advisors.length}): ${advisors.map(a=>{const t=tasks.filter(x=>x.advisorId===a.id);return `${a.name}[tareas:${t.length},completadas:${t.filter(x=>x.status==='Completada').length}]`}).join(', ')}.
Tareas totales: ${tasks.length}. Pendientes: ${tasks.filter(t=>t.status!=='Completada').length}. Completadas: ${tasks.filter(t=>t.status==='Completada').length}.
Leads por estado: ${STATUS_OPTS.map(s=>`${s}:${leads.filter(l=>l.status===s).length}`).join(', ')}.`;

    try{
      const res=await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          model:'claude-sonnet-4-20250514',
          max_tokens:1000,
          messages:[{role:'user',content:`Eres el asistente estratégico de ventas de Propiedades Energy Bless, empresa chilena especializada en parcelas rurales. Responde siempre en español, con análisis concreto y recomendaciones accionables para Giannina Lazo y su equipo.

Contexto actual del CRM:
${ctx}

Consulta: ${question}`}]
        })
      });
      const data=await res.json();
      setResponse(data.content?.map(i=>i.text||'').join('')||'Sin respuesta');
    }catch(e){setErr('Error al conectar con IA. Revisa tu conexión a internet.');}
    setLoading(false);
  }

  return(
    <div>
      <div className="card">
        <div className="card-title" style={{marginBottom:'.5rem'}}>🤖 Análisis con Inteligencia Artificial</div>
        <p className="text-muted" style={{marginBottom:'1rem',lineHeight:'1.6'}}>El asistente IA tiene acceso completo al contexto del CRM: leads, asesores, tareas y proyectos. Puedes hacerle preguntas estratégicas o elegir una consulta frecuente.</p>
        <div style={{display:'flex',flexWrap:'wrap',gap:'.5rem',marginBottom:'1rem'}}>
          {presets.map(p=><button key={p} className="btn btn-outline btn-sm" style={{fontSize:'11px'}} onClick={()=>ask(p)}>{p}</button>)}
        </div>
        <div style={{display:'flex',gap:'.5rem'}}>
          <input className="search-input" style={{flex:1,fontSize:'14px',padding:'10px 14px'}} value={query} onChange={e=>setQuery(e.target.value)} placeholder="Escribe tu pregunta sobre el CRM, el equipo o los proyectos..." onKeyDown={e=>e.key==='Enter'&&ask()}/>
          <button className="btn btn-gold" style={{padding:'10px 20px'}} onClick={()=>ask()} disabled={loading}>{loading?'⏳':'Consultar'}</button>
        </div>
        {err&&<div className="error-msg mt1">{err}</div>}
        {loading&&<div className="ai-box mt1"><div className="ai-header">🤖 IA analizando</div>Procesando tu consulta con el contexto completo del CRM...</div>}
        {response&&<div className="ai-box mt1"><div className="ai-header">🤖 Respuesta del asistente IA</div>{response}</div>}
      </div>
    </div>
  );
}

function VentasPage({tipo,ventas,setVentas,advisors,projects,leads}){
  const titulo=tipo==='reserva'?'Reservas':'Escrituras';
  const emoji=tipo==='reserva'?'📋':'📝';
  const[showAdd,setShowAdd]=useState(false);
  const[filtroMes,setFiltroMes]=useState('Todos');
  const[filtroProj,setFiltroProj]=useState('');
  const[editId,setEditId]=useState(null);
  const[form,setForm]=useState({mes:'',proyecto:'',parcela:'',asesores:'',lead:'',fecha:new Date().toISOString().split('T')[0]});
  const[err,setErr]=useState('');

  const meses=['Todos','Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const filtered=ventas.filter(v=>{
    const okMes=filtroMes==='Todos'||v.mes===filtroMes;
    const okProj=!filtroProj||v.proyecto.toLowerCase().includes(filtroProj.toLowerCase());
    return okMes&&okProj;
  });

  const byProject=filtered.reduce((acc,v)=>{
    if(!acc[v.proyecto])acc[v.proyecto]=[];
    acc[v.proyecto].push(v);
    return acc;
  },{});

  function save(){
    if(!form.proyecto||!form.parcela||!form.asesores||!form.mes){setErr('Proyecto, parcela, asesores y mes son obligatorios');return;}
    if(editId){
      setVentas(ventas.map(v=>v.id===editId?{...form,id:editId}:v));
      setEditId(null);
    } else {
      setVentas([...ventas,{...form,id:'v'+Date.now()}]);
    }
    setForm({mes:'',proyecto:'',parcela:'',asesores:'',lead:'',fecha:new Date().toISOString().split('T')[0]});
    setShowAdd(false);setErr('');
  }

  function edit(v){setForm({...v});setEditId(v.id);setShowAdd(true);}
  function remove(id){if(window.confirm('¿Eliminar este registro?'))setVentas(ventas.filter(v=>v.id!==id));}

  const leadMatch=(leadStr)=>{
    if(!leadStr)return null;
    return leads.find(l=>l.name&&l.name.toLowerCase().includes(leadStr.toLowerCase()));
  };

  return(
    <div>
      <div className="card" style={{marginBottom:'1rem'}}>
        <div className="card-header">
          <div className="card-title">{emoji} {titulo} — División Parcelas</div>
          <button className="btn btn-primary btn-sm" onClick={()=>{setShowAdd(true);setEditId(null);setForm({mes:'',proyecto:'',parcela:'',asesores:'',lead:'',fecha:new Date().toISOString().split('T')[0]});}}>+ Agregar {tipo}</button>
        </div>
        <div style={{display:'flex',gap:'12px',flexWrap:'wrap',marginBottom:'1rem'}}>
          <div className="field" style={{margin:0}}>
            <label>Filtrar por mes</label>
            <select value={filtroMes} onChange={e=>setFiltroMes(e.target.value)}>
              {meses.map(m=><option key={m}>{m}</option>)}
            </select>
          </div>
          <div className="field" style={{margin:0,flex:1}}>
            <label>Buscar proyecto</label>
            <input value={filtroProj} onChange={e=>setFiltroProj(e.target.value)} placeholder="Nombre del proyecto..."/>
          </div>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'8px',marginBottom:'1rem'}}>
          <div className="stat-card"><div className="stat-label">Total {titulo}</div><div className="stat-num">{ventas.length}</div></div>
          <div className="stat-card"><div className="stat-label">Filtrados</div><div className="stat-num">{filtered.length}</div></div>
          <div className="stat-card gold"><div className="stat-label">Proyectos</div><div className="stat-num" style={{color:'var(--gold)'}}>{Object.keys(byProject).length}</div></div>
        </div>
      </div>

      {showAdd&&(
        <div className="card" style={{marginBottom:'1rem',border:'2px solid var(--green)'}}>
          <div className="card-title" style={{marginBottom:'1rem'}}>{editId?'Editar':'Nuevo'} {tipo}</div>
          <div className="grid2">
            <div className="field"><label>Mes *</label>
              <select value={form.mes} onChange={e=>setForm({...form,mes:e.target.value})}>
                <option value="">Seleccionar mes</option>
                {meses.slice(1).map(m=><option key={m}>{m}</option>)}
              </select>
            </div>
            <div className="field"><label>Fecha</label><input type="date" value={form.fecha} onChange={e=>setForm({...form,fecha:e.target.value})}/></div>
            <div className="field"><label>Proyecto *</label>
              <select value={form.proyecto} onChange={e=>setForm({...form,proyecto:e.target.value})}>
                <option value="">Seleccionar proyecto</option>
                {projects.map(p=><option key={p}>{p}</option>)}
              </select>
            </div>
            <div className="field"><label>Parcela *</label><input value={form.parcela} onChange={e=>setForm({...form,parcela:e.target.value})} placeholder="Ej: Pc 23"/></div>
            <div className="field"><label>Asesor(es) *</label><input value={form.asesores} onChange={e=>setForm({...form,asesores:e.target.value})} placeholder="Ej: Franco Campos"/></div>
            <div className="field"><label>Lead vinculado (nombre)</label><input value={form.lead} onChange={e=>setForm({...form,lead:e.target.value})} placeholder="Nombre del cliente (opcional)"/></div>
          </div>
          {err&&<div className="error-msg">{err}</div>}
          <div className="flex"><button className="btn btn-primary btn-sm" onClick={save}>Guardar</button><button className="btn btn-outline btn-sm" onClick={()=>{setShowAdd(false);setErr('');}}>Cancelar</button></div>
        </div>
      )}

      {Object.keys(byProject).length===0&&<div className="card" style={{textAlign:'center',color:'var(--muted)',padding:'2rem'}}>No hay {titulo.toLowerCase()} registradas</div>}

      {Object.entries(byProject).map(([proj,items])=>(
        <div key={proj} className="card" style={{marginBottom:'1rem'}}>
          <div className="card-header">
            <div className="card-title" style={{fontSize:'14px'}}>🏡 {proj} <span className="badge badge-green" style={{marginLeft:'8px'}}>{items.length}</span></div>
          </div>
          <table>
            <thead><tr><th>Parcela</th><th>Asesor(es)</th><th>Lead vinculado</th><th>Mes</th><th>Fecha</th><th></th></tr></thead>
            <tbody>
              {items.map(v=>{
                const lead=leadMatch(v.lead);
                return(
                  <tr key={v.id}>
                    <td><code style={{background:'var(--green-pale)',padding:'2px 8px',borderRadius:'4px'}}>{v.parcela}</code></td>
                    <td className="fw6">{v.asesores}</td>
                    <td>{v.lead?<span style={{color:lead?'var(--green)':'var(--muted)',fontSize:'12px'}}>{lead?'✅ '+lead.name:'⚠️ '+v.lead+' (no vinculado)'}</span>:<span style={{color:'var(--muted)',fontSize:'12px'}}>—</span>}</td>
                    <td><span className="badge badge-gold">{v.mes}</span></td>
                    <td className="text-muted" style={{fontSize:'12px'}}>{v.fecha}</td>
                    <td style={{display:'flex',gap:'4px'}}>
                      <button className="btn btn-sm" style={{background:'var(--green)',color:'#fff',fontSize:'11px'}} onClick={()=>edit(v)}>✏️</button>
                      <button className="btn btn-danger btn-sm" onClick={()=>remove(v.id)}>✕</button>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      ))}
    </div>
  );
}

// ─── MÉTRICAS & GRÁFICOS ────────────────────────
function MetricasPage({leads,reservas,escrituras,advisors,projects,tasks}){
  const[mesFilter,setMesFilter]=useState('Todos');
  const meses=['Todos','Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

  // Stats de leads
  const total=leads.length;
  const nuevos=leads.filter(l=>l.status==='Nuevo').length;
  const contactados=leads.filter(l=>l.status==='Contactado').length;
  const seguimiento=leads.filter(l=>l.status==='Seguimiento').length;
  const visitaAgendada=leads.filter(l=>l.status==='Visita agendada').length;
  const propuestaEnviada=leads.filter(l=>l.status==='Propuesta enviada').length;
  const reservados=leads.filter(l=>l.status==='Reservado').length;
  const descartados=leads.filter(l=>l.status==='Descartado').length;

  // Ventas filtradas
  const resF=mesFilter==='Todos'?reservas:reservas.filter(r=>r.mes===mesFilter);
  const escF=mesFilter==='Todos'?escrituras:escrituras.filter(e=>e.mes===mesFilter);

  // Embudo clásico
  const funnelSteps=[
    {label:'Leads Totales',val:total,color:'#1a3d2b',icon:'👥'},
    {label:'Contactados',val:contactados+seguimiento+visitaAgendada+propuestaEnviada+reservados,color:'#2d6a4f',icon:'📞'},
    {label:'En Seguimiento',val:seguimiento+visitaAgendada+propuestaEnviada+reservados,color:'#52b788',icon:'🔄'},
    {label:'Visita / Propuesta',val:visitaAgendada+propuestaEnviada+reservados,color:'#c9a84c',icon:'🏡'},
    {label:'Reservados',val:reservados,color:'#b8952e',icon:'✅'},
  ];

  // Leads por proyecto
  const byProj={};
  leads.forEach(l=>{byProj[l.project]=(byProj[l.project]||0)+1});
  const projArr=Object.entries(byProj).sort((a,b)=>b[1]-a[1]);
  const maxProj=projArr[0]?projArr[0][1]:1;

  // Ranking asesores con puntaje compuesto
  const rankMap={};
  reservas.forEach(r=>{
    const names=r.asesores.split(/y|,/).map(n=>n.trim()).filter(Boolean);
    names.forEach(n=>{if(!rankMap[n])rankMap[n]={res:0,esc:0,tasks:0};rankMap[n].res++;});
  });
  escrituras.forEach(e=>{
    const names=e.asesores.split(/y|,/).map(n=>n.trim()).filter(Boolean);
    names.forEach(n=>{if(!rankMap[n])rankMap[n]={res:0,esc:0,tasks:0};rankMap[n].esc++;});
  });
  advisors.forEach(a=>{
    const done=tasks.filter(t=>t.advisorId===a.id&&t.status==='Completada').length;
    const firstName=a.name.split(' ')[0];
    const key=Object.keys(rankMap).find(k=>k.toLowerCase().includes(firstName.toLowerCase()))||a.name;
    if(!rankMap[key])rankMap[key]={res:0,esc:0,tasks:0};
    rankMap[key].tasks+=done;
  });
  const rankArr=Object.entries(rankMap)
    .map(([name,v])=>({name,res:v.res,esc:v.esc,tasks:v.tasks,score:v.res*2+v.esc*3+v.tasks*0.5}))
    .filter(x=>x.score>0)
    .sort((a,b)=>b.score-a.score);
  const maxScore=rankArr[0]?rankArr[0].score:1;
  const medals=['🥇','🥈','🥉'];

  // Gráfico ventas por mes
  const ventasPorMes=['Enero','Febrero','Marzo','Abril','Mayo','Junio'].map(m=>({
    label:m.substring(0,3),
    val:reservas.filter(r=>r.mes===m).length+escrituras.filter(e=>e.mes===m).length
  }));

  // Reservas por proyecto
  const resProjMap={};
  resF.forEach(r=>{resProjMap[r.proyecto]=(resProjMap[r.proyecto]||0)+1});
  const resProjArr=Object.entries(resProjMap).sort((a,b)=>b[1]-a[1]);
  const maxResProj=resProjArr[0]?resProjArr[0][1]:1;

  return(
    <div>
      {/* Filtro de mes */}
      <div className="card" style={{marginBottom:'1rem'}}>
        <div style={{display:'flex',gap:'8px',alignItems:'center',flexWrap:'wrap'}}>
          <span className="fw6" style={{color:'var(--green-dark)',fontSize:'13px'}}>📅 Filtrar ventas por mes:</span>
          {['Todos','Mayo','Junio'].map(m=>(
            <button key={m} className={`btn btn-sm ${mesFilter===m?'btn-primary':'btn-outline'}`} onClick={()=>setMesFilter(m)}>{m}</button>
          ))}
        </div>
      </div>

      {/* KPIs fila */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:'10px',marginBottom:'1.2rem'}}>
        {[
          {label:'Total Leads',val:total,color:'var(--green-dark)'},
          {label:'Contacto Activo',val:contactados+seguimiento,color:'var(--green)'},
          {label:'En Proceso',val:visitaAgendada+propuestaEnviada,color:'var(--gold)'},
          {label:'Reservas (filtro)',val:resF.length,color:'var(--green)'},
          {label:'Escrituras (filtro)',val:escF.length,color:'#c9a84c'},
        ].map(k=>(
          <div key={k.label} className="stat-card" style={{padding:'.8rem'}}>
            <div className="stat-label" style={{fontSize:'10px'}}>{k.label}</div>
            <div className="stat-num" style={{color:k.color,fontSize:'22px'}}>{k.val}</div>
          </div>
        ))}
      </div>

      <div className="grid2" style={{marginBottom:'1rem'}}>
        {/* Embudo de conversión visual */}
        <div className="card">
          <div className="card-title" style={{marginBottom:'1.2rem'}}>🔽 Embudo de Conversión</div>
          {funnelSteps.map((step,i)=>{
            const pct=total>0?Math.round(step.val/total*100):0;
            const width=100-i*12;
            return(
              <div key={step.label} style={{textAlign:'center',marginBottom:'6px'}}>
                <div style={{
                  width:width+'%',margin:'0 auto',
                  background:step.color,color:'#fff',
                  borderRadius:'6px',padding:'10px 8px',
                  fontSize:'12px',fontWeight:'600',
                  display:'flex',justifyContent:'space-between',alignItems:'center',
                  paddingLeft:'16px',paddingRight:'16px',
                  boxShadow:'0 2px 6px rgba(0,0,0,0.1)',
                  transition:'all .3s'
                }}>
                  <span>{step.icon} {step.label}</span>
                  <span style={{background:'rgba(255,255,255,0.25)',borderRadius:'12px',padding:'2px 10px'}}>{step.val} ({pct}%)</span>
                </div>
                {i<funnelSteps.length-1&&<div style={{fontSize:'14px',color:'var(--muted)',lineHeight:'1.2'}}>▼</div>}
              </div>
            );
          })}
          <div style={{marginTop:'1rem',padding:'10px 14px',background:'var(--green-pale)',borderRadius:'10px',fontSize:'12px',display:'flex',justifyContent:'space-between'}}>
            <span className="fw6" style={{color:'var(--green-dark)'}}>Tasa de conversión total</span>
            <span className="fw6" style={{color:'var(--green)',fontSize:'15px'}}>{total>0?Math.round(reservados/total*100):0}%</span>
          </div>
          <div style={{marginTop:'6px',padding:'10px 14px',background:'#fdecea',borderRadius:'10px',fontSize:'12px',display:'flex',justifyContent:'space-between'}}>
            <span style={{color:'var(--danger)'}}>⚠️ Descartados</span>
            <span style={{color:'var(--danger)',fontWeight:'600'}}>{descartados} ({total>0?Math.round(descartados/total*100):0}%)</span>
          </div>
        </div>

        {/* Gráfico ventas por mes */}
        <div className="card">
          <div className="card-title" style={{marginBottom:'1rem'}}>📈 Ventas por Mes (Reservas + Escrituras)</div>
          <BarChart data={ventasPorMes} color="var(--green)" height={90}/>
          <div style={{borderTop:'1px solid var(--border)',marginTop:'1rem',paddingTop:'1rem'}}>
            <div className="card-title" style={{fontSize:'13px',marginBottom:'.8rem'}}>🏡 Reservas por Proyecto</div>
            {resProjArr.length===0&&<div className="text-muted" style={{textAlign:'center',padding:'.5rem'}}>Sin datos</div>}
            {resProjArr.map(([proj,cnt])=>(
              <div key={proj} style={{marginBottom:'7px'}}>
                <div style={{display:'flex',justifyContent:'space-between',fontSize:'11px',marginBottom:'2px'}}>
                  <span>{proj}</span><span className="fw6" style={{color:'var(--green)'}}>{cnt}</span>
                </div>
                <div style={{background:'var(--bg)',borderRadius:'4px',height:'7px'}}>
                  <div style={{width:Math.round(cnt/maxResProj*100)+'%',height:'100%',background:'var(--green)',borderRadius:'4px'}}></div>
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* Ranking asesores con puntaje compuesto */}
      <div className="card" style={{marginBottom:'1rem'}}>
        <div className="card-header">
          <div className="card-title">🏆 Ranking General de Asesores</div>
          <div style={{fontSize:'11px',color:'var(--muted)'}}>Puntaje: Reserva×2 + Escritura×3 + Tarea completada×0.5</div>
        </div>
        {rankArr.length===0&&<div className="text-muted" style={{textAlign:'center',padding:'1rem'}}>Sin datos de ventas aún</div>}
        <div style={{overflowX:'auto'}}>
          <table>
            <thead>
              <tr><th>#</th><th>Asesor</th><th>Reservas</th><th>Escrituras</th><th>Tareas ✓</th><th>Puntaje</th><th>Rendimiento</th></tr>
            </thead>
            <tbody>
              {rankArr.map((a,i)=>(
                <tr key={a.name}>
                  <td><span style={{fontSize:'18px'}}>{medals[i]||<span className="badge badge-gray">{i+1}</span>}</span></td>
                  <td className="fw6">{a.name}</td>
                  <td><span className="badge badge-green">{a.res}</span></td>
                  <td><span className="badge badge-gold">{a.esc}</span></td>
                  <td><span className="badge badge-blue">{a.tasks}</span></td>
                  <td><span className="fw6" style={{color:'var(--green-dark)',fontSize:'15px'}}>{a.score.toFixed(1)}</span></td>
                  <td style={{minWidth:'120px'}}>
                    <div style={{background:'var(--bg)',borderRadius:'4px',height:'8px'}}>
                      <div style={{width:Math.round(a.score/maxScore*100)+'%',height:'100%',background:i===0?'var(--gold)':i===1?'#aaa':i===2?'#cd7f32':'var(--green)',borderRadius:'4px'}}></div>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      {/* Leads por proyecto detalle */}
      <div className="card">
        <div className="card-title" style={{marginBottom:'1rem'}}>📊 Leads por Proyecto (Detalle)</div>
        {projArr.length===0&&<div className="text-muted" style={{textAlign:'center',padding:'1rem'}}>Sin leads</div>}
        {projArr.map(([proj,cnt])=>(
          <div key={proj} style={{marginBottom:'10px'}}>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:'13px',marginBottom:'4px'}}>
              <span className="fw6">{proj}</span>
              <span style={{color:'var(--green)',fontWeight:'600'}}>{cnt} leads</span>
            </div>
            <div style={{background:'var(--bg)',borderRadius:'6px',height:'10px',overflow:'hidden'}}>
              <div style={{width:Math.round(cnt/maxProj*100)+'%',height:'100%',background:'var(--green)',borderRadius:'6px'}}></div>
            </div>
            <div style={{display:'flex',gap:'6px',marginTop:'4px',flexWrap:'wrap'}}>
              {STATUS_OPTS.map(s=>{
                const n=leads.filter(l=>l.project===proj&&l.status===s).length;
                if(n===0)return null;
                return<span key={s} className={`badge ${STATUS_COLORS[s]||'badge-gray'}`} style={{fontSize:'10px'}}>{s}: {n}</span>;
              })}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function InformesPage({leads,reservas,escrituras,advisors,projects,tasks}){
  const[mes,setMes]=useState('Mayo');

  const meses=['Mayo','Junio'];

  const resMs=reservas.filter(r=>r.mes===mes);

  const rankRes={};
  resMs.forEach(r=>{

    names.forEach(n=>{if(!rankRes[n])rankRes[n]=0;rankRes[n]++;});
  });
  const rankResArr=Object.entries(rankRes).sort((a,b)=>b[1]-a[1]);

  // Ranking por escrituras
  const rankEsc={};
  escMs.forEach(e=>{
    const names=e.asesores.split(/y|,/).map(n=>n.trim()).filter(Boolean);
    names.forEach(n=>{if(!rankEsc[n])rankEsc[n]=0;rankEsc[n]++;});
  });
  const rankEscArr=Object.entries(rankEsc).sort((a,b)=>b[1]-a[1]);

  // Por proyecto
  const projRes={};
  resMs.forEach(r=>{if(!projRes[r.proyecto])projRes[r.proyecto]=0;projRes[r.proyecto]++;});
  const projResArr=Object.entries(projRes).sort((a,b)=>b[1]-a[1]);

  const projEsc={};
  escMs.forEach(e=>{if(!projEsc[e.proyecto])projEsc[e.proyecto]=0;projEsc[e.proyecto]++;});

  const maxRes=rankResArr[0]?rankResArr[0][1]:1;

  const maxProjRes=projResArr[0]?projResArr[0][1]:1;

  // Ranking combinado (reservas + escrituras)
  const rankCombined={};
  resMs.forEach(r=>{
    const names=r.asesores.split(/y|,/).map(n=>n.trim()).filter(Boolean);
    names.forEach(n=>{if(!rankCombined[n])rankCombined[n]={res:0,esc:0};rankCombined[n].res++;});
  });
  escMs.forEach(e=>{
    const names=e.asesores.split(/y|,/).map(n=>n.trim()).filter(Boolean);
    names.forEach(n=>{if(!rankCombined[n])rankCombined[n]={res:0,esc:0};rankCombined[n].esc++;});
  });
  const rankCombArr=Object.entries(rankCombined)

INFORME ${mes.toUpperCase()} 2026:

${ctx}`}]

      {/* Informe IA */}

        {rankCombArr.length===0&&<div className="text-muted" style={{textAlign:'center',padding:'1rem'}}>Sin datos</div>}
        <div style={{overflowX:'auto'}}>
          <table>
            <thead><tr><th>#</th><th>Asesor</th><th>Reservas</th><th>Escrituras</th><th>Total</th><th>Rendimiento</th></tr></thead>
            <tbody>
              {rankCombArr.map((a,i)=>{
                const maxT=rankCombArr[0]?.total||1;
                return(
                  <tr key={a.name}>
                    <td><span style={{fontSize:'18px'}}>{medals[i]||<span className="badge badge-gray">{i+1}</span>}</span></td>
                    <td className="fw6">{a.name}</td>
                    <td><span className="badge badge-green">{a.res}</span></td>
                    <td><span className="badge badge-gold">{a.esc}</span></td>
                    <td><span className="badge" style={{background:'var(--green-dark)',color:'#fff'}}>{a.total}</span></td>
                    <td style={{minWidth:'120px'}}>
                      <div style={{background:'var(--border)',borderRadius:'4px',height:'8px'}}>
                        <div style={{width:Math.round(a.total/maxT*100)+'%',height:'100%',background:i===0?'var(--gold)':i===1?'#aaa':i===2?'#cd7f32':'var(--green)',borderRadius:'4px'}}></div>
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'1rem',marginBottom:'1rem'}}>
        {/* Ranking reservas */}
        <div className="card">
          <div className="card-title" style={{marginBottom:'1rem'}}>📋 Ranking Reservas — {mes}</div>
          {rankResArr.length===0&&<div style={{color:'var(--muted)',textAlign:'center',padding:'1rem'}}>Sin datos</div>}
          {rankResArr.map(([name,cnt],i)=>(
            <div key={name} style={{display:'flex',alignItems:'center',gap:'10px',padding:'8px 0',borderBottom:'1px solid var(--border)'}}>
              <span style={{fontSize:'18px',minWidth:'28px'}}>{medals[i]||'  '+(i+1)}</span>
              <div style={{flex:1}}>
                <div className="fw6" style={{fontSize:'13px'}}>{name}</div>
                <div style={{background:'var(--bg)',borderRadius:'4px',height:'6px',marginTop:'4px'}}>
                  <div style={{width:Math.round(cnt/maxRes*100)+'%',height:'100%',background:'var(--green)',borderRadius:'4px'}}></div>
                </div>
              </div>
              <span className="badge badge-green">{cnt}</span>
            </div>
          ))}
        </div>

        {/* Ranking escrituras */}
        <div className="card">
          <div className="card-title" style={{marginBottom:'1rem'}}>📝 Ranking Escrituras — {mes}</div>
          {rankEscArr.length===0&&<div style={{color:'var(--muted)',textAlign:'center',padding:'1rem'}}>Sin datos</div>}
          {rankEscArr.map(([name,cnt],i)=>(
            <div key={name} style={{display:'flex',alignItems:'center',gap:'10px',padding:'8px 0',borderBottom:'1px solid var(--border)'}}>
              <span style={{fontSize:'18px',minWidth:'28px'}}>{medals[i]||'  '+(i+1)}</span>
              <div style={{flex:1}}>
                <div className="fw6" style={{fontSize:'13px'}}>{name}</div>
                <div style={{background:'var(--bg)',borderRadius:'4px',height:'6px',marginTop:'4px'}}>
                  <div style={{width:Math.round(cnt/maxEsc*100)+'%',height:'100%',background:'#c8a227',borderRadius:'4px'}}></div>
                </div>
              </div>
              <span className="badge badge-gold">{cnt}</span>
            </div>
          ))}
        </div>
      </div>

      {/* Tabla resumen asesor */}
      <div className="card">
        <div className="card-title" style={{marginBottom:'1rem'}}>📊 Resumen por Asesor — {mes}</div>
        <table>
          <thead><tr><th>#</th><th>Asesor</th><th>Reservas</th><th>Escrituras</th><th>Total</th></tr></thead>
          <tbody>
            {advisors.map((a,i)=>{
              const resCount=resMs.filter(r=>r.asesores.toLowerCase().includes(a.name.split(' ')[0].toLowerCase())).length;
              const escCount=escMs.filter(e=>e.asesores.toLowerCase().includes(a.name.split(' ')[0].toLowerCase())).length;
              if(resCount===0&&escCount===0)return null;
              return(
                <tr key={a.id}>
                  <td className="text-muted">{i+1}</td>
                  <td className="fw6">{a.name}</td>
                  <td><span className="badge badge-green">{resCount}</span></td>
                  <td><span className="badge badge-gold">{escCount}</span></td>
                  <td><span className="badge" style={{background:'var(--green-dark)',color:'#fff'}}>{resCount+escCount}</span></td>
                </tr>
              );
            }).filter(Boolean)}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function Root(){
  const[user,setUser]=useState(null);
  const[type,setType]=useState(null);
  function handleLogin(u,t){setUser(u);setType(t);}
  function handleLogout(){setUser(null);setType(null);}
  if(!user)return <Login onLogin={handleLogin}/>;
  if(type==='advisor')return <AdvisorPortal user={user} onLogout={handleLogout}/>;
  return <AdminApp user={user} onLogout={handleLogout}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
